<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="dsh-armor-supreme">
  <title>dsh-armor-supreme</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2447"/>
      <stop offset="0.55" stop-color="#111634"/>
      <stop offset="1" stop-color="#0a0d1c"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- 四层，宽度递增 = 装配序位 -->
  <rect x="80" y="52" width="96" height="22" rx="11" fill="url(#cool)" opacity="0.55"/>
  <rect x="66" y="88" width="124" height="22" rx="11" fill="url(#cool)" opacity="0.80"/>
  <rect x="52" y="124" width="152" height="22" rx="11" fill="url(#violet)"/>
  <rect x="38" y="160" width="180" height="24" rx="12" fill="url(#warm)"/>

  <!-- 尾部锚点：最后一层向下钉住 -->
  <path d="M116 194 L128 208 L140 194" fill="none" stroke="url(#warm)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
